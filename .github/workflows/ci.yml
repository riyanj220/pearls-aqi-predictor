name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-validation:
    name: Python validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APP_ENV: development
      LOG_LEVEL: INFO
      ARTIFACT_BACKEND: local
      MODEL_LOADING_MODE: LOCAL_ARTIFACT
      FEATURE_STORE_BACKEND: local
      MODEL_REGISTRY_BACKEND: local
      AUTOMATIC_RETRAINING_ENABLED: "false"
      AUTOMATIC_MODEL_PROMOTION_ENABLED: "false"

      PEARLS_API_PHASE_6_LATEST_DIRECTORY: tests/fixtures/aqi/latest
      PEARLS_API_ARTIFACT_CACHE_SECONDS: "0"
      PEARLS_API_FORECAST_STALENESS_THRESHOLD_HOURS: "100000"
      PEARLS_API_FORECAST_AGING_THRESHOLD_HOURS: "50000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Validate lockfile
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      #   - name: Run targeted Ruff checks
      #     run: |
      #       uv run ruff check \
      #         app/artifacts \
      #         app/observability \
      #         app/operations \
      #         app/pipelines/live_inference.py \
      #         app/pipelines/aqi_alert_pipeline.py

      #   - name: Check targeted formatting
      #     run: |
      #       uv run ruff format --check \
      #         app/artifacts \
      #         app/observability \
      #         app/operations \
      #         app/pipelines/live_inference.py \
      #         app/pipelines/aqi_alert_pipeline.py

      - name: Compile application modules
        run: |
          uv run python -m compileall -q app

      - name: Validate repository inspection
        run: |
          uv run python -m \
            app.operations.repository_inspection

      - name: Validate cloud architecture inventory
        env:
          AZURE_LOCATION: centralindia
          AZURE_RESOURCE_SUFFIX: riyan
        run: |
          uv run python -m \
            app.operations.cloud_architecture

      - name: Validate deployment configuration
        env:
          APP_ENV: demo
          APP_VERSION: ci-${{ github.sha }}
          SERVICE_ROLE: api
          AZURE_LOCATION: centralindia
          AZURE_RESOURCE_GROUP: rg-pearls-aqi-demo
          AZURE_CONTAINER_REGISTRY: walpole.azurecr.io
          ARTIFACT_BACKEND: azure_blob
          AZURE_STORAGE_ACCOUNT: stpearlsaqiriyan
          AZURE_STORAGE_CONTAINER: artifacts
          AZURE_KEY_VAULT_NAME: kv-pearls-aqi-riyan
          ALLOWED_CORS_ORIGINS: https://dashboard.example.com
        run: |
          uv run python -m \
            app.operations.deployment_config

      - name: Validate artifact repository
        run: |
          uv run python -m \
            app.operations.artifact_repository_validation

      - name: Validate structured logging
        run: |
          uv run python -m \
            app.operations.structured_logging_validation

      - name: Validate pipeline command imports
        run: |
          uv run python -m \
            app.pipelines.live_inference --help

          uv run python -m \
            app.pipelines.aqi_alert_pipeline --help

          uv run python -m \
            app.pipelines.incremental_features --help

          uv run python -m \
            app.pipelines.retraining_cycle --help

          uv run python -m \
            app.pipelines.champion_challenger --help

      - name: Run automated tests
        run: uv run pytest -q

      - name: Upload Phase 10 validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-10-validation-reports
          path: reports/phase_10/
          if-no-files-found: warn
          retention-days: 14

  container-validation:
    name: Container validation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      IMAGE_TAG: ci-${{ github.sha }}
      APP_VERSION: 0.1.0
      GIT_COMMIT: ${{ github.sha }}
      BUILD_DATE: "ci-build"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate production Compose configuration
        run: |
          docker compose \
            --file compose.production.yml \
            --profile jobs \
            config

      - name: List production services
        run: |
          docker compose \
            --file compose.production.yml \
            --profile jobs \
            config \
            --services

      - name: Build production images
        env:
          BUILDKIT_PROGRESS: plain
        run: |
          docker compose \
            --progress plain \
            --file compose.production.yml \
            --profile jobs \
            build

      - name: Inspect built images
        run: |
          docker image inspect \
            "pearls-aqi-api:${IMAGE_TAG}" \
            --format '{{.Id}} {{.Os}}/{{.Architecture}} {{.Config.User}}'

          docker image inspect \
            "pearls-aqi-dashboard:${IMAGE_TAG}" \
            --format '{{.Id}} {{.Os}}/{{.Architecture}} {{.Config.User}}'

          docker image inspect \
            "pearls-aqi-pipeline:${IMAGE_TAG}" \
            --format '{{.Id}} {{.Os}}/{{.Architecture}} {{.Config.User}}'

      - name: Validate production image contracts
        run: |
          python -m \
            app.operations.container_image_validation \
            --image-tag "${IMAGE_TAG}"

      - name: Validate pipeline commands inside image
        run: |
          docker run \
            --rm \
            "pearls-aqi-pipeline:${IMAGE_TAG}" \
            python -m app.pipelines.live_inference --help

          docker run \
            --rm \
            "pearls-aqi-pipeline:${IMAGE_TAG}" \
            python -m app.pipelines.aqi_alert_pipeline --help

          docker run \
            --rm \
            "pearls-aqi-pipeline:${IMAGE_TAG}" \
            python -m app.pipelines.incremental_features --help

          docker run \
            --rm \
            "pearls-aqi-pipeline:${IMAGE_TAG}" \
            python -m app.pipelines.retraining_cycle --help

          docker run \
            --rm \
            "pearls-aqi-pipeline:${IMAGE_TAG}" \
            python -m app.pipelines.champion_challenger --help

      - name: Upload container validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-10-container-validation-report
          path: reports/phase_10/container_image_validation_report.json
          if-no-files-found: warn
          retention-days: 14
