name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-validation:
    name: Python validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APP_ENV: development
      LOG_LEVEL: INFO

      ARTIFACT_BACKEND: local
      MODEL_LOADING_MODE: LOCAL_ARTIFACT
      FEATURE_STORE_BACKEND: local
      MODEL_REGISTRY_BACKEND: local

      AUTOMATIC_RETRAINING_ENABLED: "false"
      AUTOMATIC_MODEL_PROMOTION_ENABLED: "false"

      PEARLS_API_PHASE_6_LATEST_DIRECTORY: tests/fixtures/aqi/latest
      PEARLS_API_ARTIFACT_CACHE_SECONDS: "0"
      PEARLS_API_FORECAST_STALENESS_THRESHOLD_HOURS: "100000"
      PEARLS_API_FORECAST_AGING_THRESHOLD_HOURS: "50000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Validate lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Compile application
        run: |
          uv run python -m compileall -q app

      - name: Validate important pipeline imports
        run: |
          uv run python -m app.pipelines.live_inference --help

          uv run python -m app.pipelines.aqi_alert_pipeline --help

          uv run python -m app.pipelines.incremental_features --help

          uv run python -m app.pipelines.retraining_cycle --help

          uv run python -m app.pipelines.champion_challenger --help

          uv run python -m app.pipelines.publish_forecast --help || true

      - name: Validate operational imports
        run: |
          uv run python - <<'PY'
          from app.operations.persist_production_health import (
              run_persisted_production_health,
          )
          from app.pipelines.publish_forecast import (
              create_configured_repository,
          )

          print("Production operational imports passed.")
          PY

      - name: Run automated tests
        run: |
          uv run pytest -q

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  container-validation:
    name: Container validation
    needs:
      - python-validation

    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      IMAGE_TAG: ci-${{ github.sha }}
      APP_VERSION: ci-${{ github.sha }}
      GIT_COMMIT: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate build timestamp
        run: |
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> "${GITHUB_ENV}"

      - name: Build API image
        run: |
          docker build \
            --file Dockerfile.api \
            --build-arg APP_VERSION="${APP_VERSION}" \
            --build-arg GIT_COMMIT="${GIT_COMMIT}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            --tag "pearls-aqi-api:${IMAGE_TAG}" \
            .

      - name: Build dashboard image
        run: |
          docker build \
            --file Dockerfile.dashboard \
            --build-arg APP_VERSION="${APP_VERSION}" \
            --build-arg GIT_COMMIT="${GIT_COMMIT}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            --tag "pearls-aqi-dashboard:${IMAGE_TAG}" \
            .

      - name: Build pipeline image
        run: |
          docker build \
            --file Dockerfile.pipeline \
            --build-arg APP_VERSION="${APP_VERSION}" \
            --build-arg GIT_COMMIT="${GIT_COMMIT}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            --tag "pearls-aqi-pipeline:${IMAGE_TAG}" \
            .

      - name: Verify non-root containers
        run: |
          echo "API user:"
          docker image inspect \
            "pearls-aqi-api:${IMAGE_TAG}" \
            --format '{{.Config.User}}'

          echo "Dashboard user:"
          docker image inspect \
            "pearls-aqi-dashboard:${IMAGE_TAG}" \
            --format '{{.Config.User}}'

          echo "Pipeline user:"
          docker image inspect \
            "pearls-aqi-pipeline:${IMAGE_TAG}" \
            --format '{{.Config.User}}'

          test "$(
            docker image inspect \
              "pearls-aqi-api:${IMAGE_TAG}" \
              --format '{{.Config.User}}'
          )" = "pearls"

          test "$(
            docker image inspect \
              "pearls-aqi-dashboard:${IMAGE_TAG}" \
              --format '{{.Config.User}}'
          )" = "dashboard"

          test "$(
            docker image inspect \
              "pearls-aqi-pipeline:${IMAGE_TAG}" \
              --format '{{.Config.User}}'
          )" = "pipeline"

      - name: Validate release metadata
        run: |
          for image in \
            "pearls-aqi-api:${IMAGE_TAG}" \
            "pearls-aqi-dashboard:${IMAGE_TAG}" \
            "pearls-aqi-pipeline:${IMAGE_TAG}"
          do
            echo
            echo "${image}"

            docker image inspect \
              "${image}" \
              --format '
          Version:  {{index .Config.Labels "org.opencontainers.image.version"}}
          Revision: {{index .Config.Labels "org.opencontainers.image.revision"}}
          Created:  {{index .Config.Labels "org.opencontainers.image.created"}}
          User:     {{.Config.User}}
          '
          done

      - name: Validate pipeline runtime contracts
        run: |
          docker run \
            --rm \
            --entrypoint /bin/sh \
            "pearls-aqi-pipeline:${IMAGE_TAG}" \
            -c '
              set -e

              test -x /app/bin/run_hourly_features
              test -x /app/bin/run_daily_retraining
              test -x /app/bin/run_production_health

              python -c "
          from app.pipelines.publish_forecast import create_configured_repository
          from app.operations.persist_production_health import run_persisted_production_health
          print(\"Pipeline runtime contracts passed.\")
          "
            '

      - name: Smoke test API liveness
        run: |
          docker run \
            --detach \
            --rm \
            --name pearls-ci-api \
            --publish 18000:8000 \
            "pearls-aqi-api:${IMAGE_TAG}"

          cleanup() {
            docker stop pearls-ci-api >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:18000/api/v1/health/live \
              >/dev/null
            then
              echo "API liveness passed."
              exit 0
            fi

            sleep 2
          done

          docker logs pearls-ci-api
          exit 1

      - name: Smoke test dashboard process
        run: |
          docker run \
            --detach \
            --rm \
            --name pearls-ci-dashboard \
            --publish 18501:8501 \
            --env FASTAPI_BASE_URL=http://127.0.0.1:18000/api/v1 \
            "pearls-aqi-dashboard:${IMAGE_TAG}"

          cleanup() {
            docker stop pearls-ci-dashboard >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:18501/_stcore/health \
              >/dev/null
            then
              echo "Dashboard health passed."
              exit 0
            fi

            sleep 2
          done

          docker logs pearls-ci-dashboard
          exit 1
