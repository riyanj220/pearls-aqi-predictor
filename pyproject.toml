[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pearls-aqi-predictor"
version = "0.1.0"
description = "72-hour PM2.5-based AQI forecasting project for Zafar Memon DHA, Karachi"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "jupyter>=1.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "xgboost>=3.2.0",
    "matplotlib>=3.11.1",
    "shap==0.52.0",
    "numba==0.61.2",
    "llvmlite==0.44.0",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
exclude = ["data*", "notebooks*", "scripts*", "tests*"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
