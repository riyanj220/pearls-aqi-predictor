[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pearls-aqi-predictor"
version = "0.1.0"
description = "72-hour PM2.5-based AQI forecasting project for Zafar Memon DHA, Karachi"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "jupyter>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
exclude = ["data*", "notebooks*", "scripts*", "tests*"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
